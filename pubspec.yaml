name: shishu_suraksha
description: Shishu Suraksha ECD App
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State mgmt
  provider: ^6.1.2
  flutter_riverpod: ^2.3.6
  google_fonts: ^8.0.1

  # UI + Utils
  lottie: ^3.3.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.3
  intl: 0.20.2
  fl_chart: ^1.1.1
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  audioplayers: ^6.5.1
  google_mlkit_pose_detection: ^0.14.0
  google_mlkit_image_labeling: ^0.14.1
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_face_mesh_detection: ^0.4.1
  tflite_flutter: ^0.12.1
  camera: ^0.11.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  tflite_audio:
    path: packages/tflite_audio
  http: ^1.6.0
  image: ^4.1.3
  flutter_dotenv: ^6.0.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  permission_handler: ^12.0.1
  table_calendar: ^3.1.2
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  
  # Google Calendar Integration
  google_sign_in: ^7.1.1
  googleapis: ^16.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  
  # Local Database
  sqflite: ^2.3.2
  path: ^1.9.0
  excel: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  share_plus: ^12.0.1
  flutter_layout_grid: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/animations/
    - assets/lang/
    - assets/
    - assets/ml/
    - .env

