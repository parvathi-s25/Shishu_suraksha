name: shishu_suraksha
description: Shishu Suraksha ECD App
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State mgmt
  provider: ^6.1.2
  flutter_riverpod: ^2.3.6

  # UI + Utils
  lottie: ^2.7.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.3
  intl: ^0.19.0
  fl_chart: ^0.68.0
  image_picker: ^1.0.7
  audioplayers: ^5.2.1
  google_mlkit_pose_detection: ^0.14.0
  camera: ^0.10.5
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.3
  tflite_audio:
    path: packages/tflite_audio
  http: ^0.13.6
  image: ^4.1.3
  flutter_dotenv: ^5.1.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  permission_handler: ^12.0.1
  table_calendar: ^3.1.2
  
  # Google Calendar Integration
  google_sign_in: ^6.1.6
  googleapis: ^13.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  
  # Local Database
  sqflite: ^2.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/animations/
    - assets/logos/
    - assets/images/
    - assets/animations/
    - assets/lang/
    - assets/
    - .env

